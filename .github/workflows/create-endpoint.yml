name: create-endpoint

on:
  workflow_call:
    inputs:
      endpoint_file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      endpoint_name:
        required: true
        type: string
      endpoint_type:
        required: true
        type: string
      storage_account_name:
        required: false
        type: string
        default: ""
      storage_container_name:
        required: false
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
jobs:
  create-endpoint:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Az CLI login"
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: install-extension
        run: az extension add -n ml -y
      - name: update-extension
        run: az extension update -n ml
      - name: create-or-update-endpoint
        env:
          ENDPOINT_TYPE: ${{ inputs.endpoint_type }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          ENDPOINT_FILE: ${{ github.workspace }}/${{ inputs.endpoint_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
        run: |
          existing_name=$(az ml "${ENDPOINT_TYPE}-endpoint" show --name "$ENDPOINT_NAME" --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME" --query name -o tsv 2>/dev/null || echo "")
          if [[ -z "$existing_name" ]]; then
            echo "Endpoint does not exist. Creating..."
            az ml "${ENDPOINT_TYPE}-endpoint" create --name "$ENDPOINT_NAME" \
            -f "$ENDPOINT_FILE" --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
          else
            echo "Endpoint '$ENDPOINT_NAME' already exists. Updating..."
            az ml "${ENDPOINT_TYPE}-endpoint" update --name "$ENDPOINT_NAME" \
            -f "$ENDPOINT_FILE" --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME"
          fi
      - name: authorize-endpoint-storage
        if: ${{ inputs.storage_account_name != '' || inputs.storage_container_name != '' }}
        env:
          ENDPOINT_TYPE: ${{ inputs.endpoint_type }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          STORAGE_ACCOUNT_NAME: ${{ inputs.storage_account_name }}
          STORAGE_CONTAINER_NAME: ${{ inputs.storage_container_name }}
        run: |
          set -euo pipefail

          if [[ -z "$STORAGE_ACCOUNT_NAME" || -z "$STORAGE_CONTAINER_NAME" ]]; then
            echo "Both storage_account_name and storage_container_name are required when endpoint storage authorization is enabled." >&2
            exit 1
          fi

          if [[ "$ENDPOINT_TYPE" != "online" ]]; then
            echo "Endpoint storage authorization is supported only for online endpoints." >&2
            exit 1
          fi

          principal_id=$(az ml online-endpoint show \
            --name "$ENDPOINT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE_NAME" \
            --query identity.principal_id \
            --output tsv)
          if [[ -z "$principal_id" ]]; then
            echo "Online endpoint '$ENDPOINT_NAME' does not expose a managed identity principal ID." >&2
            exit 1
          fi

          storage_account_id=$(az storage account show \
            --name "$STORAGE_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)
          container_scope="${storage_account_id}/blobServices/default/containers/${STORAGE_CONTAINER_NAME}"

          az resource show \
            --ids "$container_scope" \
            --api-version 2023-05-01 \
            --output none

          assignment_id=$(az role assignment list \
            --assignee "$principal_id" \
            --scope "$container_scope" \
            --include-inherited \
            --output json | jq -r --arg scope "$container_scope" \
              '[.[] | select(.roleDefinitionName == "Storage Blob Data Contributor" and (.scope | ascii_downcase) == ($scope | ascii_downcase))][0].id // ""')

          if [[ -z "$assignment_id" ]]; then
            assignment_id=$(az role assignment create \
              --assignee-object-id "$principal_id" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$container_scope" \
              --query id \
              --output tsv)
          fi

          assignment_visible=false
          for attempt in {1..20}; do
            if az role assignment show --ids "$assignment_id" --output none 2>/dev/null; then
              assignment_visible=true
              break
            fi
            echo "Waiting for endpoint storage role assignment to propagate (attempt ${attempt}/20)..."
            sleep 15
          done

          if [[ "$assignment_visible" != "true" ]]; then
            echo "Role assignment '$assignment_id' was not observable after five minutes." >&2
            exit 1
          fi

          {
            echo "### Endpoint storage authorization"
            echo "- Endpoint principal: \`$principal_id\`"
            echo "- Role: \`Storage Blob Data Contributor\`"
            echo "- Scope: \`$container_scope\`"
          } >> "$GITHUB_STEP_SUMMARY"
