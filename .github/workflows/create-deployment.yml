name: create-deployment

on:
  workflow_call:
    inputs:
      endpoint_file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      endpoint_name:
        required: true
        type: string
      endpoint_type:
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      extra_args:
        description: "Optional extra arguments appended verbatim to az ml <type>-deployment create (e.g. '--set environment_variables.MONITORING_STORAGE_ACCOUNT=stexample'). Leave empty for no override."
        required: false
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
jobs:
  create-deployment:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Az CLI login"
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: install-extension
        run: az extension add -n ml -y
      - name: update-extension
        run: az extension update -n ml
      - name: create-or-replace-deployment
        env:
          ENDPOINT_TYPE: ${{ inputs.endpoint_type }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          ENDPOINT_NAME: ${{ inputs.endpoint_name }}
          ENDPOINT_FILE: ${{ github.workspace }}/${{ inputs.endpoint_file }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          existing_name=$(az ml "${ENDPOINT_TYPE}-deployment" show --name "$DEPLOYMENT_NAME" --endpoint "$ENDPOINT_NAME" --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME" --query name -o tsv 2>/dev/null || echo "")
          if [[ -n "$existing_name" ]]; then
            echo "Deployment '$DEPLOYMENT_NAME' already exists (possibly from a prior failed attempt) - deleting before recreating, since properties like instance_type may not apply via an in-place update."
            az ml "${ENDPOINT_TYPE}-deployment" delete --name "$DEPLOYMENT_NAME" --endpoint "$ENDPOINT_NAME" --resource-group "$RESOURCE_GROUP" --workspace-name "$WORKSPACE_NAME" --yes
          fi
          az ml "${ENDPOINT_TYPE}-deployment" create --name "$DEPLOYMENT_NAME" --endpoint "$ENDPOINT_NAME" \
          -f "$ENDPOINT_FILE" --resource-group "$RESOURCE_GROUP" \
          --workspace-name "$WORKSPACE_NAME" $EXTRA_ARGS
